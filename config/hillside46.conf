# Encoders (Uncomment these two line to add support to your firmware)
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# RGB Underglow (Uncomment these two lines to add support to your firmware)
# RGB quickly drains battery power
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Boost the Bluetooth signal only if having connection issues
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Disable the 2 Mbps PHY.
#
# The 2018 Intel Mac mini uses a Broadcom controller (bluetoothctl reports
# Manufacturer: 0x000f). ZMK documents this exact case: disabling the 2M PHY is needed to
# pair and connect with "older Intel Macs with Broadcom chipsets".
#
# Symptom without it: BlueZ reports "Connection successful" and then the host immediately
# tears the link down again with "Connection terminated by local host", followed by
# org.bluez.Error.AuthenticationCanceled. Bonding never completes, or completes on the
# host side only and the keyboard never reconnects.
CONFIG_BT_CTLR_PHY_2M=n

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=50
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=50
